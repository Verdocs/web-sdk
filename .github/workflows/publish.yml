name: Publish

# Publishes the committed versions of @verdocs/web-sdk and @verdocs/web-sdk-react with npm trusted publishing (OIDC).
on:
  push:
    branches: [main]
    paths:
      - verdocs-web-sdk/package.json
      - verdocs-web-sdk-react/package.json
      - scripts/publish.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node scripts/publish.mjs
